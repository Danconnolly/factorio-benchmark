[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "factorio-benchmark"
version = "0.1.3"
description = "Reproducible player-constrained Factorio benchmark scenarios and evaluators"
readme = "README.md"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/factorio_benchmark"]
artifacts = ["src/factorio_benchmark/assets/**"]
